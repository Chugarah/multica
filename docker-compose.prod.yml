# Production stack for Multica on Windows Server 2019 (Docker Desktop / WSL2 backend).
#
# This file is the production counterpart to docker-compose.selfhost.yml.
# Differences vs selfhost:
#   - No host port bindings (postgres / backend / frontend are reachable only over
#     the internal compose network). cloudflared is the only outbound surface.
#   - All services have healthchecks + restart policies + json-file log rotation.
#   - Resource limits sized for a 7 GB RAM host running Docker Desktop + WSL2.
#   - Hard guards: JWT_SECRET, POSTGRES_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN must be
#     set; compose refuses to start if any are empty (the `:?` syntax).
#
# Usage:
#   cp .env.production.example .env.production
#   # Edit .env.production — fill EVERY value. No placeholders.
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Or use the wrapper scripts under scripts/windows/.
#
# Public surface: managed in the Cloudflare Zero Trust dashboard (named tunnel
# multica-home). See docs/deployment/cloudflare-tunnel.md.

name: multica-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MULTICA_VERSION:-prod}
        COMMIT: ${MULTICA_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (generate with openssl rand -base64 48)}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set (e.g. https://multica.chugarah.com)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@multica.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:?MULTICA_APP_URL must be set (e.g. https://multica.chugarah.com)}
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        REMOTE_API_URL: http://backend:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set (Zero Trust > Networks > Tunnels > multica-home)}
    # extra_hosts: lets cloudflared reach Windows host services (RDP/SSH) by name.
    # Required so the dashboard ingress rule rdp://host.docker.internal:3389 works.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_started
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

volumes:
  pgdata:
  backend_uploads:
